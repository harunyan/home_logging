<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐾 Cat Home Logging Monitor | WinSV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      /* Matching veris.jp Slate Theme */
      --bg-slate-950: #0b0f19;
      --bg-slate-900: #0f172a;
      --bg-slate-850: #131d33;
      --bg-slate-800: #1e293b;
      --bg-card: rgba(30, 41, 59, 0.72);
      --border-slate: rgba(148, 163, 184, 0.12);
      --border-focus: rgba(56, 189, 248, 0.4);
      
      --accent-sky: #38bdf8;
      --accent-cyan: #22d3ee;
      --accent-orange: #fb923c;
      --accent-emerald: #34d399;
      --accent-violet: #a78bfa;
      
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --card-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.45), 0 4px 6px -2px rgba(0, 0, 0, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-slate-900);
      background-image: 
        radial-gradient(at 10% 15%, rgba(56, 189, 248, 0.08) 0px, transparent 40%),
        radial-gradient(at 90% 85%, rgba(251, 146, 60, 0.05) 0px, transparent 40%),
        radial-gradient(circle at 50% 50%, var(--bg-slate-900) 0%, var(--bg-slate-950) 100%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-slate);
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      font-size: 2.2rem;
      background: linear-gradient(135deg, var(--accent-sky), var(--accent-cyan));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    h1 {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: #ffffff;
    }

    .server-tag {
      font-size: 0.72rem;
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent-sky);
      padding: 3px 10px;
      border-radius: 9999px;
      border: 1px solid rgba(56, 189, 248, 0.25);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      background: rgba(30, 41, 59, 0.8);
      color: var(--text-main);
      border: 1px solid var(--border-slate);
      padding: 7px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 500;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(8px);
    }

    .btn:hover {
      background: rgba(51, 65, 85, 0.8);
      border-color: rgba(148, 163, 184, 0.3);
      color: #ffffff;
      transform: translateY(-1px);
    }

    /* Summary Grid */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-slate);
      border-radius: 14px;
      padding: 18px;
      box-shadow: var(--card-shadow);
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(56, 189, 248, 0.3);
    }

    .card-title {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 500;
    }

    .card-value {
      font-size: 1.8rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 4px;
      letter-spacing: -0.02em;
    }

    .card-subtext {
      font-size: 0.72rem;
      color: var(--text-dim);
    }

    .val-orange { color: var(--accent-orange); }
    .val-sky { color: var(--accent-sky); }
    .val-emerald { color: var(--accent-emerald); }
    .val-violet { color: var(--accent-violet); }

    /* Graph Section */
    .graph-section {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-slate);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--card-shadow);
      margin-bottom: 24px;
    }

    .graph-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .tabs {
      display: flex;
      gap: 6px;
      background: rgba(15, 23, 42, 0.8);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border-slate);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      color: var(--text-main);
    }

    .tab-btn.active {
      background: var(--bg-slate-800);
      color: var(--accent-sky);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .range-selector {
      display: flex;
      gap: 4px;
      background: rgba(15, 23, 42, 0.8);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border-slate);
    }

    .range-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .range-btn:hover {
      color: var(--text-main);
    }

    .range-btn.active {
      background: var(--accent-sky);
      color: #0f172a;
      font-weight: 700;
    }

    .chart-container {
      position: relative;
      height: 320px;
      width: 100%;
    }

    /* Layout Sections */
    .main-content {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 24px;
    }

    @media (max-width: 950px) {
      .main-content {
        grid-template-columns: 1fr;
      }
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* History Table */
    .table-container {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-slate);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      max-height: 400px;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.82rem;
    }

    th {
      background: rgba(15, 23, 42, 0.85);
      padding: 12px 14px;
      color: var(--text-muted);
      font-weight: 600;
      border-bottom: 1px solid var(--border-slate);
      position: sticky;
      top: 0;
      backdrop-filter: blur(8px);
      z-index: 1;
    }

    td {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.06);
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }

    .badge-scale { background: rgba(56, 189, 248, 0.12); color: var(--accent-sky); border: 1px solid rgba(56, 189, 248, 0.25); }
    .badge-feeder { background: rgba(251, 146, 60, 0.12); color: var(--accent-orange); border: 1px solid rgba(251, 146, 60, 0.25); }
    .badge-sensor { background: rgba(167, 139, 250, 0.12); color: var(--accent-violet); border: 1px solid rgba(167, 139, 250, 0.25); }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
    }
    .status-online { background-color: var(--accent-emerald); box-shadow: 0 0 8px var(--accent-emerald); }
    .status-offline { background-color: #64748b; }

    /* Device List Side */
    .device-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .device-item {
      background: var(--bg-card);
      border: 1px solid var(--border-slate);
      border-radius: 12px;
      padding: 14px;
    }

    .device-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .device-id {
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
    }

    .device-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    .empty-state {
      text-align: center;
      padding: 36px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <span class="brand-icon">🐾</span>
        <div>
          <h1>Cat Home Logging Monitor</h1>
          <div style="display: flex; gap: 8px; align-items: center; margin-top: 3px;">
            <span class="server-tag">WinSV Go Receiver</span>
            <span id="refresh-status" style="font-size: 0.72rem; color: var(--text-muted);">● 自動更新中 (1分)</span>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn" onclick="fetchData()">🔄 手動更新</button>
      </div>
    </header>

    <!-- Summary Statistics Grid -->
    <div class="summary-grid">
      <div class="card">
        <div class="card-title"><span>餌皿の現在残量</span> <span>🍽️</span></div>
        <div class="card-value val-orange" id="sum-food-weight">-- <span style="font-size: 0.95rem; font-weight: normal;">g</span></div>
        <div class="card-subtext" id="sum-food-time">未測定</div>
      </div>
      <div class="card">
        <div class="card-title"><span>猫の最新測定体重</span> <span>⚖️</span></div>
        <div class="card-value val-sky" id="sum-cat-weight">-- <span style="font-size: 0.95rem; font-weight: normal;">g</span></div>
        <div class="card-subtext" id="sum-cat-time">未測定</div>
      </div>
      <div class="card">
        <div class="card-title"><span>室内環境 (ENV IV)</span> <span>🌡️</span></div>
        <div class="card-value val-emerald" id="sum-env-temp">--.- <span style="font-size: 0.95rem; font-weight: normal;">°C</span></div>
        <div class="card-subtext" id="sum-env-sub">湿度: --% / 気圧: -- hPa</div>
      </div>
      <div class="card">
        <div class="card-title"><span>本日の食事回数</span> <span>🥣</span></div>
        <div class="card-value val-orange" id="sum-meals-count">0 <span style="font-size: 0.95rem; font-weight: normal;">回</span></div>
        <div class="card-subtext" id="sum-food-eaten">食べた量: 0.0g</div>
      </div>
      <div class="card">
        <div class="card-title"><span>本日の総受信数</span> <span>📡</span></div>
        <div class="card-value val-violet" id="sum-events-count">0</div>
        <div class="card-subtext">ログレコード数</div>
      </div>
      <div class="card">
        <div class="card-title"><span>登録デバイス数</span> <span>📶</span></div>
        <div class="card-value val-sky" id="sum-devices-count">0 <span style="font-size: 0.95rem; font-weight: normal;">台</span></div>
        <div class="card-subtext">稼働中クライアント</div>
      </div>
    </div>

    <!-- Interactive Time-Series Graphs -->
    <div class="graph-section">
      <div class="graph-header">
        <div class="tabs">
          <button class="tab-btn active" id="tab-weight" onclick="switchGraphTab('weight')">🍽️ 餌皿残量・重量</button>
          <button class="tab-btn" id="tab-env" onclick="switchGraphTab('env')">🌡️ 室温・湿度</button>
          <button class="tab-btn" id="tab-pressure" onclick="switchGraphTab('pressure')">⏱️ 気圧</button>
        </div>
        <div class="range-selector">
          <button class="range-btn" id="range-60" onclick="setGraphRange(60)">1時間</button>
          <button class="range-btn" id="range-360" onclick="setGraphRange(360)">6時間</button>
          <button class="range-btn active" id="range-1440" onclick="setGraphRange(1440)">24時間</button>
          <button class="range-btn" id="range-all" onclick="setGraphRange(0)">全件</button>
        </div>
      </div>
      <div class="chart-container">
        <canvas id="mainChart"></canvas>
      </div>
    </div>

    <!-- Main Content Area: History & Devices -->
    <div class="main-content">
      <!-- Events History Table -->
      <div>
        <div class="section-title">
          <span>📋</span>
          <span>受信ログ履歴 (最新50件)</span>
        </div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>発生時刻</th>
                <th>デバイス</th>
                <th>種別</th>
                <th>イベント</th>
                <th style="text-align: right;">重量 / 差分</th>
                <th>環境</th>
                <th>メモ</th>
              </tr>
            </thead>
            <tbody id="events-tbody">
              <tr>
                <td colspan="7" class="empty-state">データを受信していません。</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Devices Sidebar -->
      <div>
        <div class="section-title">
          <span>📱</span>
          <span>デバイス稼働状態</span>
        </div>
        <div class="device-list" id="devices-list">
          <div class="empty-state" style="background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border-slate);">
            デバイス未登録
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let mainChart = null;
    let currentTab = 'weight';
    let currentRangeMinutes = 1440; // Default 24 hours
    let rawEventsData = [];

    Chart.defaults.color = '#94a3b8';
    Chart.defaults.borderColor = 'rgba(148, 163, 184, 0.08)';
    Chart.defaults.font.family = "'Outfit', 'Noto Sans JP', sans-serif";

    function initChart() {
      const ctx = document.getElementById('mainChart').getContext('2d');
      mainChart = new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [] },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { position: 'top', labels: { boxWidth: 12, usePointStyle: true, color: '#94a3b8' } },
            tooltip: {
              backgroundColor: 'rgba(15, 23, 42, 0.95)',
              titleColor: '#ffffff',
              bodyColor: '#f1f5f9',
              borderColor: 'rgba(56, 189, 248, 0.25)',
              borderWidth: 1,
              padding: 10,
              displayColors: true
            }
          },
          scales: {
            x: {
              grid: { color: 'rgba(148, 163, 184, 0.05)' },
              ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 10 }
            },
            y: {
              grid: { color: 'rgba(148, 163, 184, 0.05)' }
            }
          }
        }
      });
    }

    async function fetchData() {
      try {
        const [sumRes, devRes, evRes] = await Promise.all([
          fetch('/api/v1/summary').then(r => r.json()),
          fetch('/api/v1/devices').then(r => r.json()),
          fetch('/api/v1/events?limit=500').then(r => r.json())
        ]);

        updateSummary(sumRes);
        updateDevices(devRes.devices || []);
        rawEventsData = evRes.events || [];
        updateEventsTable(rawEventsData.slice(0, 50));
        renderChart();
        document.getElementById('refresh-status').textContent = '● 自動更新中 (1分)';
      } catch (err) {
        console.error('Fetch error:', err);
        document.getElementById('refresh-status').textContent = '⚠️ 接続エラー';
      }
    }

    function updateSummary(s) {
      if (!s) return;

      if (s.latest_food_weight_g > 0 || (s.latest_food_time && s.latest_food_weight_g >= 0)) {
        document.getElementById('sum-food-weight').innerHTML = `${s.latest_food_weight_g.toFixed(1)} <span style="font-size: 0.95rem; font-weight: normal;">g</span>`;
        if (s.latest_food_time) {
          const dt = new Date(s.latest_food_time);
          document.getElementById('sum-food-time').textContent = `更新: ${dt.toLocaleTimeString()}`;
        }
      } else {
        document.getElementById('sum-food-weight').innerHTML = `-- <span style="font-size: 0.95rem; font-weight: normal;">g</span>`;
        document.getElementById('sum-food-time').textContent = `未測定`;
      }

      if (s.latest_cat_weight_g > 0) {
        document.getElementById('sum-cat-weight').innerHTML = `${s.latest_cat_weight_g.toFixed(1)} <span style="font-size: 0.95rem; font-weight: normal;">g</span> (${(s.latest_cat_weight_g / 1000).toFixed(2)} kg)`;
        const dt = new Date(s.latest_weight_time);
        document.getElementById('sum-cat-time').textContent = `測定: ${dt.toLocaleTimeString()}`;
      } else {
        document.getElementById('sum-cat-weight').innerHTML = `-- <span style="font-size: 0.95rem; font-weight: normal;">g</span>`;
        document.getElementById('sum-cat-time').textContent = `未測定`;
      }

      document.getElementById('sum-meals-count').innerHTML = `${s.today_meals_count} <span style="font-size: 0.95rem; font-weight: normal;">回</span>`;
      document.getElementById('sum-food-eaten').textContent = `食べた量: ${s.today_food_eaten_g.toFixed(1)}g`;

      if (s.latest_temp_c !== undefined && s.latest_temp_c !== null) {
        document.getElementById('sum-env-temp').innerHTML = `${s.latest_temp_c.toFixed(1)} <span style="font-size: 0.95rem; font-weight: normal;">°C</span>`;
        const humStr = s.latest_humidity_pct !== undefined && s.latest_humidity_pct !== null ? `${s.latest_humidity_pct.toFixed(1)}%` : '--%';
        const pressStr = s.latest_pressure_hpa !== undefined && s.latest_pressure_hpa !== null ? `${s.latest_pressure_hpa.toFixed(0)} hPa` : '-- hPa';
        document.getElementById('sum-env-sub').textContent = `湿度: ${humStr} / 気圧: ${pressStr}`;
      } else {
        document.getElementById('sum-env-temp').innerHTML = `--.- <span style="font-size: 0.95rem; font-weight: normal;">°C</span>`;
        document.getElementById('sum-env-sub').textContent = `湿度: --% / 気圧: -- hPa`;
      }

      document.getElementById('sum-events-count').textContent = s.total_events_today;
      document.getElementById('sum-devices-count').innerHTML = `${s.active_devices_count} <span style="font-size: 0.95rem; font-weight: normal;">台</span>`;
    }

    function switchGraphTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`tab-${tab}`).classList.add('active');
      renderChart();
    }

    function setGraphRange(minutes) {
      currentRangeMinutes = minutes;
      document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
      const id = minutes === 0 ? 'range-all' : `range-${minutes}`;
      const btn = document.getElementById(id);
      if (btn) btn.classList.add('active');
      renderChart();
    }

    function renderChart() {
      if (!mainChart || rawEventsData.length === 0) return;

      let filtered = [...rawEventsData].reverse();
      if (currentRangeMinutes > 0) {
        const cutoff = new Date(Date.now() - currentRangeMinutes * 60 * 1000);
        filtered = filtered.filter(e => new Date(e.timestamp) >= cutoff);
      }

      if (filtered.length === 0) {
        filtered = [...rawEventsData].reverse().slice(-10);
      }

      const labels = filtered.map(e => {
        const d = new Date(e.timestamp);
        return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
      });

      if (currentTab === 'weight') {
        const weights = filtered.map(e => e.weight_g !== undefined ? e.weight_g : null);
        mainChart.data.labels = labels;
        mainChart.data.datasets = [{
          label: '餌皿残量 (g)',
          data: weights,
          borderColor: '#fb923c',
          backgroundColor: 'rgba(251, 146, 60, 0.15)',
          fill: true,
          tension: 0.3,
          pointRadius: 3,
          pointBackgroundColor: '#fb923c',
          borderWidth: 2
        }];
        mainChart.options.scales = {
          x: { grid: { color: 'rgba(148, 163, 184, 0.05)' } },
          y: {
            title: { display: true, text: '重量 (g)', color: '#fb923c' },
            grid: { color: 'rgba(148, 163, 184, 0.05)' },
            suggestedMin: 0
          }
        };

      } else if (currentTab === 'env') {
        const temps = filtered.map(e => e.temperature_c !== undefined && e.temperature_c !== null ? e.temperature_c : null);
        const hums = filtered.map(e => e.humidity_pct !== undefined && e.humidity_pct !== null ? e.humidity_pct : null);
        mainChart.data.labels = labels;
        mainChart.data.datasets = [
          {
            label: '室温 (°C)',
            data: temps,
            borderColor: '#34d399',
            backgroundColor: 'rgba(52, 211, 153, 0.1)',
            yAxisID: 'yTemp',
            tension: 0.3,
            borderWidth: 2
          },
          {
            label: '湿度 (%)',
            data: hums,
            borderColor: '#38bdf8',
            backgroundColor: 'rgba(56, 189, 248, 0.1)',
            yAxisID: 'yHum',
            tension: 0.3,
            borderWidth: 2
          }
        ];
        mainChart.options.scales = {
          x: { grid: { color: 'rgba(148, 163, 184, 0.05)' } },
          yTemp: {
            type: 'linear',
            position: 'left',
            title: { display: true, text: '温度 (°C)', color: '#34d399' },
            grid: { color: 'rgba(148, 163, 184, 0.05)' }
          },
          yHum: {
            type: 'linear',
            position: 'right',
            title: { display: true, text: '湿度 (%)', color: '#38bdf8' },
            grid: { drawOnChartArea: false },
            suggestedMin: 0,
            suggestedMax: 100
          }
        };

      } else if (currentTab === 'pressure') {
        const pressures = filtered.map(e => e.pressure_hpa !== undefined && e.pressure_hpa !== null ? e.pressure_hpa : null);
        mainChart.data.labels = labels;
        mainChart.data.datasets = [{
          label: '気圧 (hPa)',
          data: pressures,
          borderColor: '#a78bfa',
          backgroundColor: 'rgba(167, 139, 250, 0.15)',
          fill: true,
          tension: 0.3,
          borderWidth: 2
        }];
        mainChart.options.scales = {
          x: { grid: { color: 'rgba(148, 163, 184, 0.05)' } },
          y: {
            title: { display: true, text: '気圧 (hPa)', color: '#a78bfa' },
            grid: { color: 'rgba(148, 163, 184, 0.05)' }
          }
        };
      }

      mainChart.update();
    }

    function updateEventsTable(events) {
      const tbody = document.getElementById('events-tbody');
      if (!events || events.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty-state">データがありません。</td></tr>`;
        return;
      }

      tbody.innerHTML = events.map(e => {
        const dt = new Date(e.timestamp);
        const timeStr = `${dt.toLocaleDateString()} ${dt.toLocaleTimeString()}`;
        let weightStr = `${e.weight_g !== undefined ? e.weight_g.toFixed(1) + 'g' : '-'}`;
        if (e.delta_g !== undefined && e.delta_g !== null) {
          const sign = e.delta_g > 0 ? '+' : '';
          weightStr += ` (${sign}${e.delta_g.toFixed(1)}g)`;
        }

        let envStr = '-';
        if (e.temperature_c !== undefined && e.temperature_c !== null) {
          envStr = `${e.temperature_c.toFixed(1)}°C / ${e.humidity_pct ? e.humidity_pct.toFixed(0) + '%' : ''}`;
        }

        return `
          <tr>
            <td style="font-family: 'JetBrains Mono', monospace; font-size: 0.78rem;">${timeStr}</td>
            <td><strong>${escapeHtml(e.device_id)}</strong></td>
            <td><span class="badge badge-${e.device_type || 'sensor'}">${escapeHtml(e.device_type)}</span></td>
            <td>${escapeHtml(e.event_type)}</td>
            <td style="text-align: right; font-family: 'JetBrains Mono', monospace; font-weight: 600;">${weightStr}</td>
            <td style="font-size: 0.78rem; color: var(--text-muted);">${envStr}</td>
            <td style="color: var(--text-muted); font-size: 0.78rem;">${escapeHtml(e.note || '')}</td>
          </tr>
        `;
      }).join('');
    }

    function updateDevices(devices) {
      const container = document.getElementById('devices-list');
      if (devices.length === 0) {
        container.innerHTML = `<div class="empty-state" style="background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border-slate);">デバイス未登録</div>`;
        return;
      }

      container.innerHTML = devices.map(d => {
        const isOnline = d.is_online;
        const lastSeen = new Date(d.last_seen).toLocaleTimeString();
        let valueStr = `${d.last_weight_g.toFixed(1)}g`;
        if (d.last_temp_c !== undefined && d.last_temp_c !== null) {
          valueStr = `${d.last_temp_c.toFixed(1)}°C / ${d.last_humidity ? d.last_humidity.toFixed(1) + '%' : ''}`;
        }
        return `
          <div class="device-item">
            <div class="device-header">
              <div class="device-id">
                <span class="status-dot ${isOnline ? 'status-online' : 'status-offline'}"></span>
                ${escapeHtml(d.device_id)}
              </div>
              <span class="badge badge-${d.device_type || 'sensor'}">${escapeHtml(d.device_type)}</span>
            </div>
            <div class="device-meta">
              <span>最終値: <strong>${valueStr}</strong></span>
              <span>${lastSeen}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    initChart();
    fetchData();
    setInterval(fetchData, 60000); // 1分おきに自動更新
  </script>
</body>
</html>
