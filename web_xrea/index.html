<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐾 Cat Home Logging Cloud | veris.jp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      /* Matching veris.jp Slate Theme */
      --bg-slate-950: #0b0f19;
      --bg-slate-900: #0f172a;
      --bg-slate-850: #131d33;
      --bg-slate-800: #1e293b;
      --bg-card: rgba(30, 41, 59, 0.72);
      --border-slate: rgba(148, 163, 184, 0.12);
      --border-focus: rgba(56, 189, 248, 0.4);
      
      --accent-sky: #38bdf8;
      --accent-cyan: #22d3ee;
      --accent-orange: #fb923c;
      --accent-emerald: #34d399;
      --accent-violet: #a78bfa;
      
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --card-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.45), 0 4px 6px -2px rgba(0, 0, 0, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-slate-900);
      background-image: 
        radial-gradient(at 10% 15%, rgba(56, 189, 248, 0.08) 0px, transparent 40%),
        radial-gradient(at 90% 85%, rgba(251, 146, 60, 0.05) 0px, transparent 40%),
        radial-gradient(circle at 50% 50%, var(--bg-slate-900) 0%, var(--bg-slate-950) 100%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-slate);
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      font-size: 2.2rem;
      background: linear-gradient(135deg, var(--accent-sky), var(--accent-cyan));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    h1 {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: #ffffff;
    }

    .server-tag {
      font-size: 0.72rem;
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent-sky);
      padding: 3px 10px;
      border-radius: 9999px;
      border: 1px solid rgba(56, 189, 248, 0.25);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      background: rgba(30, 41, 59, 0.8);
      color: var(--text-main);
      border: 1px solid var(--border-slate);
      padding: 7px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 500;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(8px);
    }

    .btn:hover {
      background: rgba(51, 65, 85, 0.8);
      border-color: rgba(148, 163, 184, 0.3);
      color: #ffffff;
      transform: translateY(-1px);
    }

    /* Summary Grid */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-slate);
      border-radius: 14px;
      padding: 18px;
      box-shadow: var(--card-shadow);
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(56, 189, 248, 0.3);
    }

    .card-title {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 500;
    }

    .card-value {
      font-size: 1.8rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 4px;
      letter-spacing: -0.02em;
    }

    .card-subtext {
      font-size: 0.72rem;
      color: var(--text-dim);
    }

    .val-orange { color: var(--accent-orange); }
    .val-sky { color: var(--accent-sky); }
    .val-emerald { color: var(--accent-emerald); }
    .val-violet { color: var(--accent-violet); }

    /* Graph Section */
    .graph-section {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-slate);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--card-shadow);
      margin-bottom: 24px;
    }

    .graph-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .tabs {
      display: flex;
      gap: 6px;
      background: rgba(15, 23, 42, 0.8);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border-slate);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      color: var(--text-main);
    }

    .tab-btn.active {
      background: var(--bg-slate-800);
      color: var(--accent-sky);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .range-selector {
      display: flex;
      gap: 4px;
      background: rgba(15, 23, 42, 0.8);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border-slate);
    }

    .range-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .range-btn:hover {
      color: var(--text-main);
    }

    .range-btn.active {
      background: var(--accent-sky);
      color: #0f172a;
      font-weight: 700;
    }

    .chart-container {
      position: relative;
      height: 320px;
      width: 100%;
    }

    /* History Table */
    .table-container {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-slate);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      max-height: 400px;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.82rem;
    }

    th {
      background: rgba(15, 23, 42, 0.85);
      padding: 12px 14px;
      color: var(--text-muted);
      font-weight: 600;
      border-bottom: 1px solid var(--border-slate);
      position: sticky;
      top: 0;
      backdrop-filter: blur(8px);
      z-index: 1;
    }

    td {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.06);
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }

    .badge-feeder { background: rgba(251, 146, 60, 0.12); color: var(--accent-orange); border: 1px solid rgba(251, 146, 60, 0.25); }
    .badge-scale { background: rgba(56, 189, 248, 0.12); color: var(--accent-sky); border: 1px solid rgba(56, 189, 248, 0.25); }
    .badge-sensor { background: rgba(167, 139, 250, 0.12); color: var(--accent-violet); border: 1px solid rgba(167, 139, 250, 0.25); }

    .empty-state {
      text-align: center;
      padding: 36px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <span class="brand-icon">🐾</span>
        <div>
          <h1>Cat Home Logging Cloud</h1>
          <div style="display: flex; gap: 8px; align-items: center; margin-top: 3px;">
            <span class="server-tag">veris.jp Cloud Host</span>
            <span id="refresh-status" style="font-size: 0.72rem; color: var(--text-muted);">● 自動更新中 (1分)</span>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn" onclick="fetchCloudData()">🔄 手動更新</button>
      </div>
    </header>

    <!-- Summary Grid -->
    <div class="summary-grid">
      <div class="card">
        <div class="card-title"><span>餌皿の現在残量</span> <span>🍽️</span></div>
        <div class="card-value val-orange" id="sum-food-weight">-- <span style="font-size: 0.95rem; font-weight: normal;">g</span></div>
        <div class="card-subtext" id="sum-food-time">未測定</div>
      </div>
      <div class="card">
        <div class="card-title"><span>猫の最新体重</span> <span>⚖️</span></div>
        <div class="card-value val-sky" id="sum-cat-weight">-- <span style="font-size: 0.95rem; font-weight: normal;">g</span></div>
        <div class="card-subtext" id="sum-cat-time">未測定</div>
      </div>
      <div class="card">
        <div class="card-title"><span>室内温湿度 (ENV IV)</span> <span>🌡️</span></div>
        <div class="card-value val-emerald" id="sum-env-temp">--.- <span style="font-size: 0.95rem; font-weight: normal;">°C</span></div>
        <div class="card-subtext" id="sum-env-sub">湿度: --% / 気圧: -- hPa</div>
      </div>
      <div class="card">
        <div class="card-title"><span>本日の食事回数</span> <span>🥣</span></div>
        <div class="card-value val-orange" id="sum-meals-count">0 <span style="font-size: 0.95rem; font-weight: normal;">回</span></div>
        <div class="card-subtext" id="sum-food-eaten">食べた量: 0.0g</div>
      </div>
      <div class="card">
        <div class="card-title"><span>本日の総受信数</span> <span>📡</span></div>
        <div class="card-value val-violet" id="sum-events-count">0</div>
        <div class="card-subtext">ログレコード数</div>
      </div>
    </div>

    <!-- Time-Series Graph -->
    <div class="graph-section">
      <div class="graph-header">
        <div class="tabs">
          <button class="tab-btn active" id="tab-weight" onclick="switchTab('weight')">🍽️ 餌皿残量・食事</button>
          <button class="tab-btn" id="tab-env" onclick="switchTab('env')">🌡️ 室温・湿度</button>
          <button class="tab-btn" id="tab-pressure" onclick="switchTab('pressure')">⏱️ 気圧</button>
        </div>
        <div class="range-selector">
          <button class="range-btn" id="range-1h" onclick="setRange('1h')">1時間</button>
          <button class="range-btn" id="range-6h" onclick="setRange('6h')">6時間</button>
          <button class="range-btn active" id="range-24h" onclick="setRange('24h')">24時間</button>
          <button class="range-btn" id="range-7d" onclick="setRange('7d')">7日間</button>
          <button class="range-btn" id="range-all" onclick="setRange('all')">全件</button>
        </div>
      </div>
      <div class="chart-container">
        <canvas id="cloudChart"></canvas>
      </div>
    </div>

    <!-- History Table -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>発生時刻</th>
            <th>デバイス</th>
            <th>種別</th>
            <th>イベント</th>
            <th style="text-align: right;">重量 / 差分</th>
            <th>環境</th>
            <th>メモ</th>
          </tr>
        </thead>
        <tbody id="events-tbody">
          <tr><td colspan="7" class="empty-state">データを読み込み中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let cloudChart = null;
    let currentTab = 'weight';
    let currentRange = '24h';
    let cloudEvents = [];

    Chart.defaults.color = '#94a3b8';
    Chart.defaults.borderColor = 'rgba(148, 163, 184, 0.08)';
    Chart.defaults.font.family = "'Outfit', 'Noto Sans JP', sans-serif";

    function initChart() {
      const ctx = document.getElementById('cloudChart').getContext('2d');
      cloudChart = new Chart(ctx, {
        type: 'line',
        data: { datasets: [] },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'nearest', intersect: false },
          plugins: {
            legend: { position: 'top', labels: { boxWidth: 12, usePointStyle: true, color: '#94a3b8' } },
            tooltip: {
              backgroundColor: 'rgba(15, 23, 42, 0.95)',
              titleColor: '#ffffff',
              bodyColor: '#f1f5f9',
              borderColor: 'rgba(56, 189, 248, 0.25)',
              borderWidth: 1,
              padding: 10,
              callbacks: {
                title: function(items) {
                  if (!items.length) return '';
                  const d = new Date(items[0].parsed.x);
                  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}:${d.getSeconds().toString().padStart(2,'0')}`;
                }
              }
            }
          },
          scales: {
            x: { type: 'linear', grid: { color: 'rgba(148, 163, 184, 0.05)' } },
            y: { grid: { color: 'rgba(148, 163, 184, 0.05)' } }
          }
        }
      });
    }

    function getXAxisConfig() {
      const now = Date.now();
      let min = null;
      let max = now;
      let isShort = true;

      if (currentRange === '1h') {
        min = now - 3600 * 1000;
      } else if (currentRange === '6h') {
        min = now - 6 * 3600 * 1000;
      } else if (currentRange === '24h') {
        min = now - 24 * 3600 * 1000;
      } else if (currentRange === '7d') {
        min = now - 7 * 86400 * 1000;
        isShort = false;
      } else {
        // 'all'
        max = null;
        isShort = false;
      }

      return {
        type: 'linear',
        min: min,
        max: max,
        grid: { color: 'rgba(148, 163, 184, 0.05)' },
        ticks: {
          maxRotation: 0,
          autoSkip: true,
          maxTicksLimit: 8,
          callback: function(val) {
            const d = new Date(val);
            if (isNaN(d.getTime())) return '';
            if (isShort) {
              return `${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
            } else {
              return `${d.getMonth()+1}/${d.getDate()} ${d.getHours().toString().padStart(2, '0')}:00`;
            }
          }
        }
      };
    }

    async function fetchCloudData() {
      try {
        const url = `api/get_sensor.php?limit=500&range=${currentRange}`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.status === 'success') {
          updateSummary(data.summary);
          cloudEvents = data.events || [];
          updateTable(cloudEvents.slice(0, 50));
          renderChart();
          document.getElementById('refresh-status').textContent = '● 自動更新中 (1分)';
        }
      } catch (err) {
        console.error('Fetch error:', err);
        document.getElementById('refresh-status').textContent = '⚠️ 接続エラー';
      }
    }

    function updateSummary(s) {
      if (!s) return;

      if (s.latest_food_weight_g !== null && s.latest_food_weight_g !== undefined) {
        document.getElementById('sum-food-weight').innerHTML = `${Number(s.latest_food_weight_g).toFixed(1)} <span style="font-size: 0.95rem; font-weight: normal;">g</span>`;
        if (s.latest_food_time) {
          const dt = new Date(s.latest_food_time);
          document.getElementById('sum-food-time').textContent = `更新: ${dt.toLocaleTimeString()}`;
        }
      }

      if (s.latest_cat_weight_g !== null && s.latest_cat_weight_g !== undefined && s.latest_cat_weight_g > 0) {
        document.getElementById('sum-cat-weight').innerHTML = `${Number(s.latest_cat_weight_g).toFixed(1)} <span style="font-size: 0.95rem; font-weight: normal;">g</span>`;
        if (s.latest_weight_time) {
          const dt = new Date(s.latest_weight_time);
          document.getElementById('sum-cat-time').textContent = `測定: ${dt.toLocaleTimeString()}`;
        }
      } else {
        document.getElementById('sum-cat-weight').innerHTML = `-- <span style="font-size: 0.95rem; font-weight: normal;">g</span>`;
        document.getElementById('sum-cat-time').textContent = `未測定`;
      }

      document.getElementById('sum-meals-count').innerHTML = `${s.today_meals_count} <span style="font-size: 0.95rem; font-weight: normal;">回</span>`;
      document.getElementById('sum-food-eaten').textContent = `食べた量: ${s.today_food_eaten_g}g`;

      if (s.latest_temp_c !== null && s.latest_temp_c !== undefined) {
        document.getElementById('sum-env-temp').innerHTML = `${Number(s.latest_temp_c).toFixed(1)} <span style="font-size: 0.95rem; font-weight: normal;">°C</span>`;
        const humStr = s.latest_humidity_pct ? `${Number(s.latest_humidity_pct).toFixed(0)}%` : '--%';
        const pressStr = s.latest_pressure_hpa ? `${Number(s.latest_pressure_hpa).toFixed(0)} hPa` : '-- hPa';
        document.getElementById('sum-env-sub').textContent = `湿度: ${humStr} / 気圧: ${pressStr}`;
      }

      document.getElementById('sum-events-count').textContent = s.total_events_today;
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`tab-${tab}`).classList.add('active');
      renderChart();
    }

    function setRange(range) {
      currentRange = range;
      document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`range-${range}`).classList.add('active');
      fetchCloudData();
    }

    function renderChart() {
      if (!cloudChart) return;

      const filtered = [...cloudEvents].reverse(); // Oldest to newest
      const xAxisConfig = getXAxisConfig();

      if (currentTab === 'weight') {
        const weightData = filtered
          .map(e => ({ x: new Date(e.timestamp).getTime(), y: e.weight_g }))
          .filter(pt => pt.y !== null && pt.y >= 0 && pt.y <= 1000);

        cloudChart.data = {
          datasets: [{
            label: '餌皿残量 (g)',
            data: weightData,
            borderColor: '#fb923c',
            backgroundColor: 'rgba(251, 146, 60, 0.15)',
            fill: true,
            tension: 0.3,
            pointRadius: 3,
            pointBackgroundColor: '#fb923c',
            borderWidth: 2
          }]
        };
        cloudChart.options.scales = {
          x: xAxisConfig,
          y: { 
            title: { display: true, text: '重量 (g)', color: '#fb923c' }, 
            grid: { color: 'rgba(148, 163, 184, 0.05)' }, 
            suggestedMin: 150,
            suggestedMax: 300
          }
        };

      } else if (currentTab === 'env') {
        const tempData = filtered
          .map(e => ({ x: new Date(e.timestamp).getTime(), y: e.temperature_c }))
          .filter(pt => pt.y !== null && pt.y >= -20 && pt.y <= 60);

        const humData = filtered
          .map(e => ({ x: new Date(e.timestamp).getTime(), y: e.humidity_pct }))
          .filter(pt => pt.y !== null && pt.y >= 0 && pt.y <= 100);

        cloudChart.data = {
          datasets: [
            {
              label: '室温 (°C)',
              data: tempData,
              borderColor: '#34d399',
              backgroundColor: 'rgba(52, 211, 153, 0.1)',
              yAxisID: 'yTemp',
              tension: 0.3,
              borderWidth: 2,
              pointRadius: 2
            },
            {
              label: '湿度 (%)',
              data: humData,
              borderColor: '#38bdf8',
              backgroundColor: 'rgba(56, 189, 248, 0.1)',
              yAxisID: 'yHum',
              tension: 0.3,
              borderWidth: 2,
              pointRadius: 2
            }
          ]
        };
        cloudChart.options.scales = {
          x: xAxisConfig,
          yTemp: { type: 'linear', position: 'left', title: { display: true, text: '温度 (°C)', color: '#34d399' }, grid: { color: 'rgba(148, 163, 184, 0.05)' } },
          yHum: { type: 'linear', position: 'right', title: { display: true, text: '湿度 (%)', color: '#38bdf8' }, grid: { drawOnChartArea: false }, suggestedMin: 0, suggestedMax: 100 }
        };

      } else if (currentTab === 'pressure') {
        const pressData = filtered
          .map(e => ({ x: new Date(e.timestamp).getTime(), y: e.pressure_hpa }))
          .filter(pt => pt.y !== null && pt.y >= 800 && pt.y <= 1200);

        cloudChart.data = {
          datasets: [{
            label: '気圧 (hPa)',
            data: pressData,
            borderColor: '#a78bfa',
            backgroundColor: 'rgba(167, 139, 250, 0.15)',
            fill: true,
            tension: 0.3,
            borderWidth: 2,
            pointRadius: 2
          }]
        };
        cloudChart.options.scales = {
          x: xAxisConfig,
          y: { title: { display: true, text: '気圧 (hPa)', color: '#a78bfa' }, grid: { color: 'rgba(148, 163, 184, 0.05)' } }
        };
      }

      cloudChart.update();
    }

    function updateTable(events) {
      const tbody = document.getElementById('events-tbody');
      if (!events || events.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty-state">データがありません。</td></tr>`;
        return;
      }

      tbody.innerHTML = events.map(e => {
        const dt = new Date(e.timestamp);
        const timeStr = `${dt.toLocaleDateString()} ${dt.toLocaleTimeString()}`;
        let weightStr = `${e.weight_g !== null && e.weight_g !== undefined ? Number(e.weight_g).toFixed(1) + 'g' : '-'}`;
        if (e.delta_g !== null && e.delta_g !== undefined) {
          const sign = e.delta_g > 0 ? '+' : '';
          weightStr += ` (${sign}${Number(e.delta_g).toFixed(1)}g)`;
        }

        let envStr = '-';
        if (e.temperature_c !== null && e.temperature_c !== undefined) {
          envStr = `${Number(e.temperature_c).toFixed(1)}°C / ${e.humidity_pct ? Number(e.humidity_pct).toFixed(0) + '%' : ''}`;
        }

        return `
          <tr>
            <td style="font-family: 'JetBrains Mono', monospace; font-size: 0.78rem;">${timeStr}</td>
            <td><strong>${escapeHtml(e.device_id)}</strong></td>
            <td><span class="badge badge-${e.device_type || 'sensor'}">${escapeHtml(e.device_type)}</span></td>
            <td>${escapeHtml(e.event_type)}</td>
            <td style="text-align: right; font-family: 'JetBrains Mono', monospace; font-weight: 600;">${weightStr}</td>
            <td style="font-size: 0.78rem; color: var(--text-muted);">${envStr}</td>
            <td style="color: var(--text-muted); font-size: 0.78rem;">${escapeHtml(e.note || '')}</td>
          </tr>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    initChart();
    fetchCloudData();
    setInterval(fetchCloudData, 60000); // 1分おきに自動更新
  </script>
</body>
</html>
